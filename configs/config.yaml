server:
  port: 8080
  mode: debug          # debug / release
  node: 1              # 雪花算法节点号（0-1023），多实例部署时每实例必须唯一（可用环境变量 WMS_SERVER_NODE 覆盖）
  read_timeout_seconds: 15
  write_timeout_seconds: 30
  idle_timeout_seconds: 60
  shutdown_timeout_seconds: 10
  body_limit_mb: 10
  cors_allow_origins: "http://localhost:5173,http://127.0.0.1:5173"
  trusted_proxies: ""  # 例如 127.0.0.1,172.16.0.0/12；生产环境不要信任所有代理

mysql:
  dsn: "root:1234@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  secret: "gowms-dev-secret-change-me-in-prod"
  expire_hours: 24

log:
  level: info          # debug / info / warn / error

upload:
  dir: ./data/uploads

metrics:
  enabled: false
  port: 9090
  path: /metrics

server:
  port: 8080
  mode: debug          # debug / release
  node: 1              # 雪花算法节点号（0-1023），多实例部署时每实例必须唯一（可用环境变量 WMS_SERVER_NODE 覆盖）
  read_timeout_seconds: 15
  write_timeout_seconds: 30
  idle_timeout_seconds: 60
  shutdown_timeout_seconds: 10
  body_limit_mb: 10
  cors_allow_origins: "http://localhost:5173,http://127.0.0.1:5173"
  trusted_proxies: ""  # 例如 127.0.0.1,172.16.0.0/12；生产环境不要信任所有代理

# 敏感凭据说明：
#   - 下面的 dsn / jwt.secret / integration.api_key 仅供本地开发使用
#   - 生产环境必须用环境变量覆盖（WMS_MYSQL_DSN / WMS_JWT_SECRET / WMS_INTEGRATION_API_KEY）
#   - release 模式启动时会拒绝弱密码/占位符（见 internal/pkg/config/config.go）
mysql:
  dsn: "root:1234@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 50
  max_idle_conns: 10

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  secret: "gowms-dev-secret-change-me-in-prod"
  expire_hours: 24

log:
  level: info          # debug / info / warn / error

upload:
  dir: ./data/uploads

metrics:
  enabled: false
  port: 9090
  path: /metrics

integration:
  api_key: "change-this-integration-api-key"

# 演示模块总开关（特性门控）：
#   true  = 提供多演示账号（demo1..demoN，各占独立租户）+ 业务流程中心 /demo 接口
#   false = 不挂载任何 /demo 路由，演示账号被禁用（生产默认；演示部署用 WMS_DEMO_ENABLED=true 覆盖）
demo:
  enabled: false
  instances: 5           # 演示账号数量：demo1~demo5，各自独立租户（10001~10005），数据互不影响
  password: "demo123456" # 所有演示账号共用密码
  session_ttl_seconds: 300

# AI 库存问答（智谱 BigModel，OpenAI 兼容接口）
# 注意：api_key 不写入本文件——只从环境变量 ZHIPU_API_KEY 读取（放在 .env，已 gitignore）；
# 模型名可用环境变量 ZHIPU_LLM_MODEL / ZHIPU_LLM_BACKUP_MODEL 覆盖下面的默认值。
ai:
  model: "glm-4.7-flash"              # 主模型（当前最强免费模型）
  backup_model: "glm-4-flash-250414"  # 备用模型：主模型拥堵（错误码 1305/429）时自动降级重试一次
  timeout_seconds: 30                 # 单次 LLM 调用超时
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  rate_limit_per_min: 10              # 每用户每分钟提问上限（Redis 计数；Redis 不可用时自动放行）

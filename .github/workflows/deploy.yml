name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: 只读读取迁移容器日志
    runs-on: ubuntu-latest
    steps:
      - name: 只读诊断（不迁移、不重启）
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/gowms' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            docker compose --env-file .env -f deploy/docker-compose.yaml exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql --batch --raw --default-character-set=utf8mb4 -uroot "$MYSQL_DATABASE"' <<'WMS_AUDIT_SQL'
            START TRANSACTION READ ONLY;
            SELECT o.id,o.tenant_id,o.order_no,o.biz_order_no,o.status,o.expected_qty,o.allocated_qty,o.picked_qty,o.created_by,o.remark,o.version,o.deleted_at,w.code AS warehouse_code,
            (SELECT COUNT(*) FROM wms_shipment_order_detail d WHERE d.tenant_id=o.tenant_id AND d.order_id=o.id) AS details,
            (SELECT COUNT(*) FROM wms_allocation a WHERE a.tenant_id=o.tenant_id AND a.order_id=o.id) AS allocations,
            (SELECT COUNT(*) FROM wms_task t WHERE t.tenant_id=o.tenant_id AND (t.order_id=o.id AND t.task_type='PICK' OR t.order_no=o.order_no)) AS tasks,
            (SELECT COUNT(*) FROM wms_inventory_trans it WHERE it.tenant_id=o.tenant_id AND it.order_no=o.order_no) AS inventory_transactions
            FROM wms_shipment_order o LEFT JOIN wms_warehouse w ON w.id=o.warehouse_id AND w.tenant_id=o.tenant_id
            WHERE NOT (o.expected_qty>=0 AND o.allocated_qty>=0 AND o.picked_qty>=0 AND o.picked_qty<=o.allocated_qty AND o.allocated_qty<=o.expected_qty)
            ORDER BY o.tenant_id,o.id LIMIT 100;
            ROLLBACK;
            
            WMS_AUDIT_SQL

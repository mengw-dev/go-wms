name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: 只读读取迁移容器日志
    runs-on: ubuntu-latest
    steps:
      - name: 只读诊断（不迁移、不重启）
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/gowms' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            docker compose --env-file .env -f deploy/docker-compose.yaml --profile tls ps -a
            docker compose --env-file .env -f deploy/docker-compose.yaml --profile tls logs --no-color --tail=80 migrate

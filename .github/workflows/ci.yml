name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gowms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WMS_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @("scripts/windows/start.ps1", "scripts/windows/stop.ps1", "scripts/windows/reset.ps1", "scripts/wms-common.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell syntax errors" }
          }

      - name: Validate Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
        run: docker compose -f deploy/docker-compose.yaml config --quiet

      - name: Verify modules
        run: go mod verify

      - name: Verify database migrations
        run: |
          go run ./cmd/migrate -seed up
          go run ./cmd/migrate version

      - name: Build
        run: go build ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GVT="$(go env GOPATH)/bin/govulncheck"
          "$GVT" -format=json ./... > vuln.json || true
          # 漏洞库实时更新，新公告可能在代码完全没变的情况下让流水线变红。
          # 因此只拦截「代码确实调用到、且上游已发布修复版本」的漏洞（trace 含 function 帧才算调用到）；
          # 上游尚未发版的漏洞无法通过升级消除，仅告警，待其发版后本步骤会自动变红要求升级。
          jq -r '.finding | select(.trace[]? | has("function")) | select(.fixed_version) | "\(.osv) 修复版本 \(.fixed_version)"' vuln.json | sort -u > vuln-fixable.txt
          jq -r '.finding | select(.trace[]? | has("function")) | select(.fixed_version | not) | .osv' vuln.json | sort -u > vuln-nofix.txt
          if [ -s vuln-nofix.txt ]; then
            echo "::warning::以下漏洞上游尚未发布修复版本，暂时无法通过升级依赖消除，本次仅告警："
            cat vuln-nofix.txt
          fi
          if [ -s vuln-fixable.txt ]; then
            echo "::error::以下漏洞已有修复版本，请升级对应依赖后重新提交："
            cat vuln-fixable.txt
            exit 1
          fi
          echo "依赖安全扫描通过：未发现可被调用的未修复漏洞"

      - name: Test（race + MySQL 集成测试）
        run: go test -race ./internal/... -v -count=1

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Dependency Audit
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test

      - name: Type Check & Build
        run: npm run build

  containers:
    name: Containers (build)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gowms-api:test .

      - name: Build frontend image
        run: docker build -t gowms-web:test ./web

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gowms_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WMS_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/gowms_e2e?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_REDIS_ADDR: 127.0.0.1:6379
      WMS_JWT_SECRET: e2e-jwt-secret-0123456789abcdef0123456789abcdef
      WMS_INTEGRATION_API_KEY: e2e-integration-api-key-0123456789abcdef
      WMS_SERVER_MODE: debug
      WMS_DEMO_ENABLED: "true"
      WMS_DEMO_USERNAME: demo
      WMS_DEMO_PASSWORD: demo123456
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Migrate and seed test database
        run: go run ./cmd/migrate -seed up

      - name: Start backend and frontend
        run: |
          go run ./cmd/wms > backend.log 2>&1 &
          echo $! > backend.pid
          (cd web && npm run dev -- --host 127.0.0.1 > ../frontend.log 2>&1 & echo $! > ../frontend.pid)

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null && curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo '--- backend ---'
          cat backend.log || true
          echo '--- frontend ---'
          cat frontend.log || true
          exit 1

      - name: Run Playwright tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Collect service logs
        if: failure()
        run: |
          cat backend.log > e2e-services.log 2>&1 || true
          cat frontend.log >> e2e-services.log 2>&1 || true

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: e2e-services.log
          if-no-files-found: ignore

      - name: Stop backend and frontend
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" 2>/dev/null || true; fi
          if [ -f frontend.pid ]; then kill "$(cat frontend.pid)" 2>/dev/null || true; fi

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gowms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WMS_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @("start.ps1", "stop.ps1", "reset.ps1", "scripts/wms-common.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell syntax errors" }
          }

      - name: Validate Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
        run: docker compose -f deploy/docker-compose.yaml config --quiet

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Test（race + MySQL 集成测试）
        run: go test -race ./internal/... -v -count=1

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Dependency Audit
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test

      - name: Type Check & Build
        run: npm run build

  containers:
    name: Containers (build)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gowms-api:test .

      - name: Build frontend image
        run: docker build -t gowms-web:test ./web

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gowms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WMS_TEST_REDIS_ADDR: "127.0.0.1:6379"
      WMS_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Check Go dependency direction (full internal tree)
        run: go run ./scripts/check-dependencies

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts -Recurse -Filter *.ps1 -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$($file.FullName) has PowerShell syntax errors" }
          }
          & ./scripts/tests/verification-gates.tests.ps1

      - name: Validate Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_PASSWORD: ci-app-password
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
        run: docker compose -f deploy/docker-compose.yaml config --quiet

      - name: Deployment regression (Git revision + readiness + metadata)
        run: bash scripts/tests/deploy.tests.sh

      - name: Verify modules
        run: go mod verify

      - name: Verify database migrations
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate bootstrap-admin
          go run ./cmd/migrate seed-demo
          go run ./cmd/migrate version

      - name: Build
        run: go build ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GVT="$(go env GOPATH)/bin/govulncheck"
          # 扫描器退出异常、报告为空/损坏/目标缺失均失败；已调用且有修复版本的漏洞阻断，
          # 上游无修复版本的已调用漏洞仅告警。由同一入口执行扫描与判定，避免忽略执行失败。
          go run ./scripts/check-vulns -scanner "$GVT" -report vuln.json

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-vulnerability-report
          path: vuln.json
          if-no-files-found: ignore

      - name: Test（race + MySQL 集成测试）
        run: go test -race ./... -v -count=1

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Dependency Audit
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test

      - name: Type Check & Build
        run: npm run build

  containers:
    name: Containers (build)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        run: |
          echo "COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "VERSION=sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" --build-arg BUILD_TIME="$BUILD_TIME" -t gowms-api:test .

      - name: Build frontend image
        run: docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" --build-arg BUILD_TIME="$BUILD_TIME" -t gowms-web:test ./web

      - name: Verify container readiness and build versions
        run: bash scripts/tests/deploy-containers.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gowms_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WMS_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/gowms_e2e?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_REDIS_ADDR: 127.0.0.1:6379
      WMS_JWT_SECRET: e2e-jwt-secret-0123456789abcdef0123456789abcdef
      WMS_INTEGRATION_API_KEY: e2e-integration-api-key-0123456789abcdef
      WMS_ADMIN_PASSWORD: admin123
      WMS_SERVER_MODE: debug
      WMS_DEMO_ENABLED: "true"
      WMS_DEMO_INSTANCES: "5"
      WMS_DEMO_USERNAME: demo1
      WMS_DEMO_PASSWORD: demo123456
      WMS_PERSONAL_ENABLED: "true"
      WMS_PERSONAL_INSTANCES: "3"
      WMS_PERSONAL_PASSWORD: user123456
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Migrate and seed test database
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate bootstrap-admin
          go run ./cmd/migrate seed-demo

      - name: Start backend and frontend
        run: |
          go run ./cmd/wms > backend.log 2>&1 &
          echo $! > backend.pid
          (cd web && npm run dev -- --host 127.0.0.1 > ../frontend.log 2>&1 & echo $! > ../frontend.pid)

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null && curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo '--- backend ---'
          cat backend.log || true
          echo '--- frontend ---'
          cat frontend.log || true
          exit 1

      - name: Run Playwright tests
        working-directory: web
        run: npm run test:e2e

      - name: Repeat one-click demo without retries
        working-directory: web
        run: npm run test:e2e -- tests/e2e/demo-console.spec.ts --grep "one-click demo executes all real stages without replay controls$" --repeat-each=5 --retries=0 --output=test-results/demo-stability --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Collect service logs
        if: failure()
        run: |
          cat backend.log > e2e-services.log 2>&1 || true
          cat frontend.log >> e2e-services.log 2>&1 || true

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: e2e-services.log
          if-no-files-found: ignore

      - name: Stop backend and frontend
        if: always()
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" 2>/dev/null || true; fi
          if [ -f frontend.pid ]; then kill "$(cat frontend.pid)" 2>/dev/null || true; fi

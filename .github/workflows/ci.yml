name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gowms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WMS_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/gowms?charset=utf8mb4&parseTime=True&loc=Local"
      WMS_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @("start.ps1", "stop.ps1", "reset.ps1", "scripts/wms-common.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell syntax errors" }
          }

      - name: Validate Docker Compose
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
        run: docker compose -f deploy/docker-compose.yaml config --quiet

      - name: Verify modules
        run: go mod verify

      - name: Verify database migrations
        run: |
          go run ./cmd/migrate -seed up
          go run ./cmd/migrate version

      - name: Build
        run: go build ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Test（race + MySQL 集成测试）
        run: go test -race ./internal/... -v -count=1

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Dependency Audit
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test

      - name: Type Check & Build
        run: npm run build

  containers:
    name: Containers (build)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gowms-api:test .

      - name: Build frontend image
        run: docker build -t gowms-web:test ./web

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      MYSQL_ROOT_PASSWORD: e2e-root-password
      MYSQL_DATABASE: gowms_e2e
      JWT_SECRET: e2e-jwt-secret-0123456789abcdef0123456789abcdef
      WMS_API_PORT: 18080
      WMS_WEB_PORT: 18081
      E2E_BASE_URL: http://127.0.0.1:18081
      COMPOSE_PROGRESS: plain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start isolated WMS stack
        run: docker compose -f deploy/docker-compose.yaml up -d --build

      - name: Wait for web health
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f deploy/docker-compose.yaml logs
          exit 1

      - name: Run Playwright tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

      - name: Collect Compose diagnostics
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yaml ps > compose.log 2>&1 || true
          docker compose -f deploy/docker-compose.yaml logs --no-color >> compose.log 2>&1 || true

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: compose.log
          if-no-files-found: ignore

      - name: Stop isolated WMS stack
        if: always()
        run: docker compose -f deploy/docker-compose.yaml down -v --remove-orphans

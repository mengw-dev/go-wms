# 自有镜像（migrate / wms / web）同时声明了 image 与 build：
#   - 服务器部署：CI 在 GitHub 上构建好并推送到 GHCR，服务器只 `docker compose pull`，不在本机编译；
#     部署 workflow 会通过 WMS_IMAGE_TAG 传入本次 commit 的镜像标签。
#   - 本地开发与 E2E：脚本一律带 --build，Compose 会以本地 Dockerfile 构建并用上面的名字打标签，
#     因此改代码后必须 --build（否则 Compose 可能去 GHCR 拉取旧镜像）。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gowms-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gowms}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ghcr.io/mengw-dev/gowms-api:${WMS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    environment:
      WMS_SERVER_MODE: release
      WMS_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-gowms-root}@tcp(mysql:3306)/${MYSQL_DATABASE:-gowms}?charset=utf8mb4&parseTime=True&loc=Local
      WMS_JWT_SECRET: ${JWT_SECRET:-}
      WMS_INTEGRATION_API_KEY: ${WMS_INTEGRATION_API_KEY:-}
      WMS_DEMO_ENABLED: ${WMS_DEMO_ENABLED:-false}
      WMS_DEMO_INSTANCES: ${WMS_DEMO_INSTANCES:-5}
      WMS_DEMO_PASSWORD: ${WMS_DEMO_PASSWORD:-demo123456}
      WMS_DEMO_SESSION_TTL_SECONDS: ${WMS_DEMO_SESSION_TTL_SECONDS:-300}
      WMS_PERSONAL_ENABLED: ${WMS_PERSONAL_ENABLED:-false}
      WMS_PERSONAL_INSTANCES: ${WMS_PERSONAL_INSTANCES:-3}
      WMS_PERSONAL_PASSWORD: ${WMS_PERSONAL_PASSWORD:-user123456}
    entrypoint: ["./migrate", "-seed", "up"]
    depends_on:
      mysql:
        condition: service_healthy

  wms:
    image: ghcr.io/mengw-dev/gowms-api:${WMS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WMS_SERVER_MODE: release
      WMS_SERVER_TRUSTED_PROXIES: ${WMS_SERVER_TRUSTED_PROXIES:-172.16.0.0/12}
      WMS_SERVER_READ_TIMEOUT_SECONDS: ${WMS_SERVER_READ_TIMEOUT_SECONDS:-15}
      WMS_SERVER_WRITE_TIMEOUT_SECONDS: ${WMS_SERVER_WRITE_TIMEOUT_SECONDS:-30}
      WMS_SERVER_IDLE_TIMEOUT_SECONDS: ${WMS_SERVER_IDLE_TIMEOUT_SECONDS:-60}
      WMS_SERVER_SHUTDOWN_TIMEOUT_SECONDS: ${WMS_SERVER_SHUTDOWN_TIMEOUT_SECONDS:-10}
      WMS_SERVER_BODY_LIMIT_MB: ${WMS_SERVER_BODY_LIMIT_MB:-10}
      WMS_SERVER_CORS_ALLOW_ORIGINS: ${WMS_SERVER_CORS_ALLOW_ORIGINS:-}
      WMS_SERVER_NODE: ${WMS_SERVER_NODE:-1}
      WMS_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-gowms-root}@tcp(mysql:3306)/${MYSQL_DATABASE:-gowms}?charset=utf8mb4&parseTime=True&loc=Local
      WMS_REDIS_ADDR: redis:6379
      WMS_JWT_SECRET: ${JWT_SECRET:-}
      WMS_INTEGRATION_API_KEY: ${WMS_INTEGRATION_API_KEY:-}
      WMS_DEMO_ENABLED: ${WMS_DEMO_ENABLED:-false}
      WMS_DEMO_INSTANCES: ${WMS_DEMO_INSTANCES:-5}
      WMS_DEMO_PASSWORD: ${WMS_DEMO_PASSWORD:-demo123456}
      WMS_DEMO_SESSION_TTL_SECONDS: ${WMS_DEMO_SESSION_TTL_SECONDS:-300}
      WMS_PERSONAL_ENABLED: ${WMS_PERSONAL_ENABLED:-false}
      WMS_PERSONAL_INSTANCES: ${WMS_PERSONAL_INSTANCES:-3}
      WMS_PERSONAL_PASSWORD: ${WMS_PERSONAL_PASSWORD:-user123456}
      WMS_UPLOAD_DIR: /app/data/uploads
      WMS_METRICS_ENABLED: ${WMS_METRICS_ENABLED:-true}
      WMS_METRICS_PORT: ${WMS_METRICS_PORT:-9090}
      WMS_METRICS_PATH: ${WMS_METRICS_PATH:-/metrics}
    ports:
      - "${WMS_API_BIND:-127.0.0.1}:${WMS_API_PORT:-8080}:8080"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/mengw-dev/gowms-web:${WMS_IMAGE_TAG:-latest}
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    # 服务器上 WMS_WEB_BIND=127.0.0.1：web 只监听回环，由 Caddy 容器对外提供 80/443。
    ports:
      - "${WMS_WEB_BIND:-0.0.0.0}:${WMS_WEB_PORT:-80}:8080"
    depends_on:
      wms:
        condition: service_healthy

  # Caddy 只在服务器上启用（--profile tls），本地开发与 E2E 不带该 profile，行为完全不变。
  # 它独占宿主机的 80/443，负责申请续期 Let's Encrypt 证书并把流量转发给 web 容器。
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      WMS_SITE_DOMAIN: ${WMS_SITE_DOMAIN:-}
      WMS_ACME_EMAIL: ${WMS_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${WMS_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      wms:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:11.3.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${WMS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${WMS_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${WMS_GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${WMS_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  upload_data:
  # 证书与 ACME 账户数据，必须持久化：丢失会触发重新申请，可能撞上 Let's Encrypt 速率限制。
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

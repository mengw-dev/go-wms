services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gowms-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gowms}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    environment:
      WMS_SERVER_MODE: release
      WMS_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-gowms-root}@tcp(mysql:3306)/${MYSQL_DATABASE:-gowms}?charset=utf8mb4&parseTime=True&loc=Local
      WMS_JWT_SECRET: ${JWT_SECRET:-}
      WMS_INTEGRATION_API_KEY: ${WMS_INTEGRATION_API_KEY:-}
    entrypoint: ["./migrate", "-seed", "up"]
    depends_on:
      mysql:
        condition: service_healthy

  wms:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WMS_SERVER_MODE: release
      WMS_SERVER_TRUSTED_PROXIES: ${WMS_SERVER_TRUSTED_PROXIES:-172.16.0.0/12}
      WMS_SERVER_READ_TIMEOUT_SECONDS: ${WMS_SERVER_READ_TIMEOUT_SECONDS:-15}
      WMS_SERVER_WRITE_TIMEOUT_SECONDS: ${WMS_SERVER_WRITE_TIMEOUT_SECONDS:-30}
      WMS_SERVER_IDLE_TIMEOUT_SECONDS: ${WMS_SERVER_IDLE_TIMEOUT_SECONDS:-60}
      WMS_SERVER_SHUTDOWN_TIMEOUT_SECONDS: ${WMS_SERVER_SHUTDOWN_TIMEOUT_SECONDS:-10}
      WMS_SERVER_BODY_LIMIT_MB: ${WMS_SERVER_BODY_LIMIT_MB:-10}
      WMS_SERVER_CORS_ALLOW_ORIGINS: ${WMS_SERVER_CORS_ALLOW_ORIGINS:-}
      WMS_SERVER_NODE: ${WMS_SERVER_NODE:-1}
      WMS_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-gowms-root}@tcp(mysql:3306)/${MYSQL_DATABASE:-gowms}?charset=utf8mb4&parseTime=True&loc=Local
      WMS_REDIS_ADDR: redis:6379
      WMS_JWT_SECRET: ${JWT_SECRET:-}
      WMS_INTEGRATION_API_KEY: ${WMS_INTEGRATION_API_KEY:-}
      WMS_UPLOAD_DIR: /app/data/uploads
      WMS_METRICS_ENABLED: ${WMS_METRICS_ENABLED:-true}
      WMS_METRICS_PORT: ${WMS_METRICS_PORT:-9090}
      WMS_METRICS_PATH: ${WMS_METRICS_PATH:-/metrics}
    ports:
      - "${WMS_API_BIND:-127.0.0.1}:${WMS_API_PORT:-8080}:8080"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WMS_WEB_PORT:-80}:8080"
    depends_on:
      wms:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${WMS_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      wms:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  upload_data:
  prometheus_data:
